<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>李煜一生 · 交互时间线</title>
<style>
  :root {
    --ink: #e8e2d4;
    --ink-light: #9a8f82;
    --gold: #e8c96a;
    --gold-deep: #b8860b;
    --crimson: #e88a8a;
    --crimson-deep: #8b3a3a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    min-height: 100%;
    background: #06080f;
  }

  body {
    font-family: "Songti SC", "SimSun", "Noto Serif SC", serif;
    color: var(--ink);
    line-height: 1.8;
    overflow-x: hidden;
  }

  .starfield {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
    pointer-events: none;
  }

  .view {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    width: 100%;
    transition: opacity 0.6s ease;
  }
  .view.hidden {
    opacity: 0;
    pointer-events: none;
    position: absolute;
    top: 0; left: 0;
    width: 100%;
  }
  .view.active {
    opacity: 1;
    pointer-events: auto;
  }

  /* ================= 时间线页 ================= */
  .tl-header {
    text-align: center;
    padding: 56px 24px 36px;
  }
  .tl-header h1 {
    font-size: clamp(26px, 4.5vw, 38px);
    font-weight: 400;
    letter-spacing: 8px;
    color: #f5ecd7;
    text-shadow: 0 0 20px rgba(184,134,11,0.8), 0 0 40px rgba(184,134,11,0.4);
  }
  .tl-header p {
    margin-top: 10px;
    font-size: 14px;
    color: var(--ink-light);
    letter-spacing: 3px;
  }
  .tl-header .hint {
    margin-top: 18px;
    display: inline-block;
    padding: 6px 18px;
    border: 1px solid rgba(184,134,11,0.5);
    border-radius: 999px;
    font-size: 13px;
    color: var(--gold);
    letter-spacing: 1px;
  }

  .timeline-section {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px 24px 80px;
  }
  .timeline { position: relative; padding: 40px 0; }

  .timeline::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 2px;
    background: linear-gradient(180deg,
      var(--gold) 0%, var(--gold) 45%,
      var(--crimson) 55%, var(--crimson) 100%);
    transform: translateX(-50%);
    box-shadow: 0 0 16px rgba(184,134,11,0.6);
  }

  .node {
    position: relative;
    width: 50%;
    cursor: pointer;
    animation: fadeIn 0.8s ease both;
  }
  .node:nth-child(odd) { left: 0; text-align: right; padding: 0 40px 40px 0; }
  .node:nth-child(even) { left: 50%; text-align: left; padding: 0 0 40px 40px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .node::after {
    content: "";
    position: absolute;
    top: 8px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff8e0;
    border: 2px solid rgba(255,255,255,0.6);
    box-shadow: 0 0 12px 3px rgba(255, 220, 120, 0.8), 0 0 24px 8px rgba(255, 200, 80, 0.35);
    transition: all 0.4s;
    z-index: 2;
    animation: pulse 3s ease-in-out infinite;
  }
  .node:nth-child(odd)::after { right: -8px; }
  .node:nth-child(even)::after { left: -8px; }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  .node.late::after {
    background: #ffd9d9;
    box-shadow: 0 0 12px 3px rgba(255, 120, 120, 0.8), 0 0 24px 8px rgba(220, 80, 80, 0.35);
  }

  .node:hover::after {
    box-shadow: 0 0 20px 6px rgba(255, 220, 120, 1), 0 0 40px 14px rgba(255, 200, 80, 0.5);
    transform: scale(1.4);
    animation: none;
  }
  .node.late:hover::after {
    box-shadow: 0 0 20px 6px rgba(255, 120, 120, 1), 0 0 40px 14px rgba(220, 80, 80, 0.5);
  }

  .node-card {
    display: inline-block;
    background: rgba(20, 26, 42, 0.7);
    border: 1px solid rgba(184,134,11,0.35);
    border-radius: 6px;
    padding: 16px 20px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
    transition: all 0.4s;
    max-width: 100%;
    backdrop-filter: blur(6px);
  }
  .node:hover .node-card {
    transform: translateY(-3px);
    border-color: var(--gold);
    box-shadow: 0 0 24px rgba(184,134,11,0.35), 0 6px 24px rgba(0,0,0,0.5);
  }
  .node.late:hover .node-card {
    border-color: var(--crimson);
    box-shadow: 0 0 24px rgba(220, 80, 80, 0.35), 0 6px 24px rgba(0,0,0,0.5);
  }

  .node-year {
    font-size: 20px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 2px;
  }
  .node.late .node-year { color: var(--crimson); }
  .node-age {
    font-size: 12px;
    color: var(--ink-light);
    margin-left: 8px;
    letter-spacing: 1px;
  }
  .node-title {
    font-size: 15px;
    margin-top: 4px;
    color: var(--ink);
    letter-spacing: 1px;
  }
  .node-hint {
    font-size: 12px;
    color: var(--ink-light);
    margin-top: 6px;
    letter-spacing: 1px;
    opacity: 0.7;
  }

  /* ================= 详情页 ================= */
  .detail-content {
    max-width: 760px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 20px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(184,134,11,0.4);
    border-radius: 999px;
    color: var(--gold);
    font-family: inherit;
    font-size: 14px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.3s;
    backdrop-filter: blur(6px);
    margin-bottom: 40px;
  }
  .back-btn:hover {
    background: rgba(184,134,11,0.15);
    border-color: var(--gold);
    transform: translateX(-3px);
  }

  .d-year {
    font-size: clamp(48px, 10vw, 84px);
    font-weight: 700;
    letter-spacing: 6px;
    color: var(--gold);
    text-shadow: 0 0 30px rgba(232,201,106,0.6), 0 0 60px rgba(232,201,106,0.3);
    line-height: 1.1;
    animation: glowIn 0.8s ease both;
  }
  .view-detail.late .d-year {
    color: var(--crimson);
    text-shadow: 0 0 30px rgba(232,138,138,0.6), 0 0 60px rgba(232,138,138,0.3);
  }
  @keyframes glowIn {
    from { opacity: 0; filter: blur(8px); }
    to { opacity: 1; filter: blur(0); }
  }

  .d-meta {
    font-size: 14px;
    color: var(--ink-light);
    margin-top: 8px;
    letter-spacing: 2px;
  }

  .d-title {
    font-size: clamp(22px, 4vw, 32px);
    font-weight: 400;
    margin: 24px 0 8px;
    letter-spacing: 3px;
    color: #f5ecd7;
    animation: fadeUp 0.7s ease 0.1s both;
  }

  .d-divider {
    width: 60px;
    height: 2px;
    background: linear-gradient(90deg, var(--gold-deep), transparent);
    margin: 24px 0;
    animation: fadeUp 0.7s ease 0.15s both;
  }
  .view-detail.late .d-divider {
    background: linear-gradient(90deg, var(--crimson-deep), transparent);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* 白话生平 */
  .d-body { animation: fadeUp 0.7s ease 0.2s both; }
  .d-body p {
    font-size: 16px;
    margin-bottom: 16px;
    color: #d8d2c4;
    line-height: 2;
  }
  .d-body strong { color: var(--gold); }
  .view-detail.late .d-body strong { color: var(--crimson); }

  /* 史料原文区块 */
  .d-source-section {
    margin-top: 36px;
    animation: fadeUp 0.7s ease 0.25s both;
  }
  .d-source-section .section-label {
    font-size: 14px;
    color: var(--gold);
    letter-spacing: 3px;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(184,134,11,0.25);
  }
  .view-detail.late .d-source-section .section-label {
    color: var(--crimson);
    border-bottom-color: rgba(139,58,58,0.3);
  }

  .source-item {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 6px;
    padding: 18px 22px;
    margin-bottom: 14px;
    backdrop-filter: blur(6px);
  }
  .source-item .source-quote {
    font-size: 15px;
    line-height: 2.2;
    color: #f0e6d2;
    letter-spacing: 0.5px;
    font-style: normal;
  }
  .source-item .source-ref {
    margin-top: 10px;
    font-size: 12px;
    color: var(--ink-light);
    letter-spacing: 1px;
    opacity: 0.85;
  }
  .source-item .source-ref::before {
    content: "—— ";
  }

  /* 诗词展示 */
  .d-poem {
    background: rgba(184,134,11,0.1);
    border-left: 3px solid var(--gold-deep);
    border-radius: 4px;
    padding: 22px 26px;
    margin: 24px 0;
    backdrop-filter: blur(6px);
    animation: fadeUp 0.7s ease 0.3s both;
  }
  .view-detail.late .d-poem {
    background: rgba(139,58,58,0.13);
    border-left-color: var(--crimson-deep);
  }
  .d-poem .poem-name {
    font-size: 16px;
    color: var(--gold);
    margin-bottom: 4px;
    letter-spacing: 2px;
  }
  .d-poem .poem-source {
    font-size: 12px;
    color: var(--ink-light);
    margin-bottom: 14px;
    letter-spacing: 1px;
    opacity: 0.85;
  }
  .d-poem .poem-text {
    font-size: 16px;
    line-height: 2.4;
    letter-spacing: 1px;
    color: #f0e6d2;
  }

  /* 画作展示 */
  .d-painting {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 4px;
    padding: 20px;
    margin: 24px 0;
    backdrop-filter: blur(6px);
    animation: fadeUp 0.7s ease 0.35s both;
  }
  .d-painting .painting-placeholder {
    width: 100%;
    height: 200px;
    background: linear-gradient(135deg, rgba(184,134,11,0.15), rgba(139,58,58,0.1));
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-light);
    font-size: 14px;
    letter-spacing: 2px;
    margin-bottom: 14px;
    border: 1px dashed rgba(184,134,11,0.3);
    text-align: center;
    padding: 20px;
  }
  .d-painting img {
    width: 100%;
    border-radius: 4px;
    display: block;
    margin-bottom: 14px;
  }
  .d-painting .painting-name {
    font-size: 15px;
    color: var(--gold);
    letter-spacing: 2px;
    margin-bottom: 4px;
  }
  .d-painting .painting-info {
    font-size: 12px;
    color: var(--ink-light);
    letter-spacing: 1px;
    opacity: 0.85;
  }

  /* 导航 */
  .d-nav {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    margin-top: 56px;
    padding-top: 28px;
    border-top: 1px solid rgba(255,255,255,0.08);
    animation: fadeUp 0.7s ease 0.4s both;
  }
  .d-nav button {
    flex: 1;
    padding: 14px 18px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    color: #d8d2c4;
    font-family: inherit;
    font-size: 14px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.3s;
    text-align: left;
  }
  .d-nav button:hover:not(:disabled) {
    background: rgba(184,134,11,0.12);
    border-color: rgba(184,134,11,0.5);
    color: var(--gold);
  }
  .d-nav button.next { text-align: right; }
  .d-nav button .nav-label {
    display: block;
    font-size: 11px;
    color: #6a6258;
    letter-spacing: 2px;
    margin-bottom: 4px;
  }
  .d-nav button:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  @media (max-width: 640px) {
    .timeline::before { left: 20px; }
    .node,
    .node:nth-child(odd),
    .node:nth-child(even) {
      width: 100%;
      left: 0;
      text-align: left;
      padding: 0 0 32px 52px;
    }
    .node:nth-child(odd)::after,
    .node:nth-child(even)::after {
      left: 12px;
      right: auto;
    }
    .detail-content { padding: 28px 20px 60px; }
    .d-nav { flex-direction: column; }
  }
</style>
</head>
<body>

<canvas class="starfield" id="starfield"></canvas>

<div class="view active" id="view-timeline">
  <div class="tl-header">
    <h1>李 煜 一 生</h1>
    <p>937 — 978 · 从帝王到囚徒</p>
    <span class="hint">点击任意时间节点，进入那一年</span>
  </div>
  <div class="timeline-section">
    <div class="timeline" id="timeline"></div>
  </div>
</div>

<div class="view hidden" id="view-detail">
  <div class="detail-content">
    <button class="back-btn" id="backBtn">← 返回时间线</button>
    <div class="d-year" id="dYear"></div>
    <div class="d-meta" id="dMeta"></div>
    <div class="d-title" id="dTitle"></div>
    <div class="d-divider"></div>
    <div class="d-body" id="dBody"></div>
    <div class="d-source-section" id="dSourceSection">
      <div class="section-label">史料原文</div>
      <div id="dSources"></div>
    </div>
    <div id="dPoemContainer"></div>
    <div id="dPaintingContainer"></div>
    <div class="d-nav">
      <button id="prevBtn">
        <span class="nav-label">上一个</span>
        <span id="prevText">—</span>
      </button>
      <button class="next" id="nextBtn">
        <span class="nav-label">下一个</span>
        <span id="nextText">—</span>
      </button>
    </div>
  </div>
</div>

<script>
// ================= 星空 Canvas =================
const canvas = document.getElementById('starfield');
const ctx = canvas.getContext('2d');
let stars = [];
let shootingStars = [];
let animId = null;
let running = false;

const nebulas = [
  { x: 0.25, y: 0.3, r: 0.35 },
  { x: 0.75, y: 0.65, r: 0.4 },
  { x: 0.5, y: 0.15, r: 0.25 }
];

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  initStars();
}

function initStars() {
  const count = Math.min(300, Math.floor(window.innerWidth * window.innerHeight / 5500));
  stars = [];
  for (let i = 0; i < count; i++) {
    let x, y;
    if (Math.random() < 0.5) {
      const neb = nebulas[Math.floor(Math.random() * nebulas.length)];
      const angle = Math.random() * Math.PI * 2;
      const dist = Math.pow(Math.random(), 2) * neb.r;
      x = (neb.x + Math.cos(angle) * dist) * canvas.width;
      y = (neb.y + Math.sin(angle) * dist) * canvas.height;
    } else {
      x = Math.random() * canvas.width;
      y = Math.random() * canvas.height;
    }
    stars.push({
      x, y,
      r: Math.random() * 1.4 + 0.3,
      baseAlpha: Math.random() * 0.5 + 0.3,
      twinkleSpeed: Math.random() * 0.02 + 0.005,
      phase: Math.random() * Math.PI * 2,
      color: Math.random() < 0.12
        ? (Math.random() < 0.5 ? '232,201,106' : '232,138,138')
        : '255,255,255'
    });
  }
}

function spawnShootingStar() {
  shootingStars.push({
    x: Math.random() * canvas.width * 0.8,
    y: Math.random() * canvas.height * 0.4,
    vx: 6 + Math.random() * 5,
    vy: 3 + Math.random() * 3,
    life: 1,
    len: 80 + Math.random() * 60
  });
}

function draw(t) {
  const grad = ctx.createRadialGradient(
    canvas.width * 0.5, canvas.height * 0.4, 0,
    canvas.width * 0.5, canvas.height * 0.4, Math.max(canvas.width, canvas.height) * 0.8
  );
  grad.addColorStop(0, '#0b1024');
  grad.addColorStop(0.5, '#060a16');
  grad.addColorStop(1, '#03050c');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (const s of stars) {
    const twinkle = Math.sin(t * s.twinkleSpeed + s.phase) * 0.35 + 0.65;
    const alpha = s.baseAlpha * twinkle;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${s.color},${alpha})`;
    ctx.fill();
    if (s.r > 1.1) {
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * 3, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${s.color},${alpha * 0.1})`;
      ctx.fill();
    }
  }

  for (let i = shootingStars.length - 1; i >= 0; i--) {
    const m = shootingStars[i];
    const tailX = m.x - m.vx * (m.len / 10);
    const tailY = m.y - m.vy * (m.len / 10);
    const g = ctx.createLinearGradient(m.x, m.y, tailX, tailY);
    g.addColorStop(0, `rgba(255,240,200,${m.life})`);
    g.addColorStop(1, 'rgba(255,240,200,0)');
    ctx.beginPath();
    ctx.moveTo(m.x, m.y);
    ctx.lineTo(tailX, tailY);
    ctx.strokeStyle = g;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(m.x, m.y, 2, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,250,230,${m.life})`;
    ctx.fill();
    m.x += m.vx;
    m.y += m.vy;
    m.life -= 0.012;
    if (m.life <= 0 || m.x > canvas.width + 100 || m.y > canvas.height + 100) {
      shootingStars.splice(i, 1);
    }
  }
}

function loop(t) {
  if (!running) return;
  draw(t * 0.06);
  if (Math.random() < 0.008) spawnShootingStar();
  animId = requestAnimationFrame(loop);
}

function startStarfield() {
  if (running) return;
  running = true;
  resizeCanvas();
  animId = requestAnimationFrame(loop);
}

window.addEventListener('resize', () => {
  if (running) resizeCanvas();
});

startStarfield();

// ================= 时间线数据 =================
const events = [
  {
    year: 937, age: "1岁", title: "生于金陵", meta: "升元元年 · 金陵",
    body: `<p>李煜出生于南唐都城<strong>金陵</strong>（今江苏南京），是南唐元宗李璟的第六子。原名李从嘉，字重光。</p>
    <p>据史书记载，他<strong>“丰额骈齿，一目重瞳”</strong>——额头宽阔，牙齿重叠，一只眼睛里有两个瞳孔。在古代相术里，重瞳被视为圣人之相，这让他从小就显得与众不同。</p>
    <p>他出生时，南唐刚建立十余年，国力尚盛。谁也没想到，这个排行第六的皇子，日后会成为南唐的最后一任君主。</p>`,
    sources: [
      { quote: "煜字重光，初名从嘉，景第六子也。煜为人仁孝，善属文，工书画，而丰额骈齿，一目重瞳子。", ref: "《新五代史》卷六十二 · 南唐世家" },
      { quote: "煜字重光，初名从嘉，景第六子也。煜为人仁孝，善属文，工书画，而丰额骈齿，一目重瞳子。", ref: "《古今图书集成·皇极典》" },
      { quote: "广额丰颊，骈齿，一目重瞳子。", ref: "《十国春秋》卷十七" }
    ],
    poem: null,
    painting: null
  },
  {
    year: 943, age: "7岁", title: "祖父李昪去世，父亲李璟即位", meta: "保大元年",
    body: `<p>李煜的祖父、南唐开国皇帝<strong>李昪</strong>去世，父亲<strong>李璟</strong>即位，是为南唐元宗。</p>
    <p>李璟雅好文学，词写得极好，著名的<strong>“细雨梦回鸡塞远，小楼吹彻玉笙寒”</strong>就出自他手。这种家庭氛围对年幼的李煜影响深远。</p>
    <p>不过李璟在位期间，南唐在与后周的战争中失利，被迫去帝号、称国主，国力开始走下坡路。</p>`,
    sources: [
      { quote: "元宗明道崇德文宣孝皇帝，名璟，字伯玉，烈祖长子也。", ref: "《新五代史》卷六十二 · 南唐世家" }
    ],
    poem: null,
    painting: null

// ================= 渲染时间线 =================
const timeline = document.getElementById('timeline');
events.forEach((ev, i) => {
  const node = document.createElement('div');
  node.className = 'node' + (ev.late ? ' late' : '');
  node.style.animationDelay = (i * 0.08) + 's';
  node.innerHTML = `
    <div class="node-card">
      <div>
        <span class="node-year">${ev.year}</span>
        <span class="node-age">${ev.age}</span>
      </div>
      <div class="node-title">${ev.title}</div>
      <div class="node-hint">点击进入 →</div>
    </div>`;
  node.addEventListener('click', () => showDetail(i));
  timeline.appendChild(node);
});

// ================= 视图切换 =================
const viewTimeline = document.getElementById('view-timeline');
const viewDetail = document.getElementById('view-detail');
let currentIndex = -1;

function showDetail(index) {
  if (index < 0 || index >= events.length) return;
  currentIndex = index;
  const ev = events[index];

  document.getElementById('dYear').textContent = ev.year;
  document.getElementById('dMeta').textContent = ev.meta + ' · 时年' + ev.age;
  document.getElementById('dTitle').textContent = ev.title;
  document.getElementById('dBody').innerHTML = ev.body;

  // 渲染史料原文
  const sourcesContainer = document.getElementById('dSources');
  if (ev.sources && ev.sources.length > 0) {
    sourcesContainer.innerHTML = ev.sources.map(s => `
      <div class="source-item">
        <div class="source-quote">${s.quote}</div>
        <div class="source-ref">${s.ref}</div>
      </div>
    `).join('');
    document.getElementById('dSourceSection').style.display = 'block';
  } else {
    document.getElementById('dSourceSection').style.display = 'none';
  }

  // 渲染诗词
  const poemContainer = document.getElementById('dPoemContainer');
  if (ev.poem) {
    poemContainer.innerHTML = `
      <div class="d-poem">
        <div class="poem-name">${ev.poem.name}</div>
        <div class="poem-source">${ev.poem.source}</div>
        <div class="poem-text">${ev.poem.text.replace(/\n/g, '<br>')}</div>
      </div>`;
  } else {
    poemContainer.innerHTML = '';
  }

  // 渲染画作
  const paintingContainer = document.getElementById('dPaintingContainer');
  if (ev.painting) {
    const imgHtml = ev.painting.img
      ? `<img src="${ev.painting.img}" alt="${ev.painting.name}">`
      : `<div class="painting-placeholder">画作图片占位<br><span style="font-size:12px;opacity:0.6;">将图片放入同目录，并在数据中填写 img 路径</span></div>`;
    paintingContainer.innerHTML = `
      <div class="d-painting">
        ${imgHtml}
        <div class="painting-name">${ev.painting.name}</div>
        <div class="painting-info">${ev.painting.info}</div>
      </div>`;
  } else {
    paintingContainer.innerHTML = '';
  }

  viewDetail.classList.toggle('late', !!ev.late);

  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const prevText = document.getElementById('prevText');
  const nextText = document.getElementById('nextText');

  if (index > 0) {
    prevBtn.disabled = false;
    prevText.textContent = events[index - 1].year + ' · ' + events[index - 1].title;
  } else {
    prevBtn.disabled = true;
    prevText.textContent = '已是起点';
  }

  if (index < events.length - 1) {
    nextBtn.disabled = false;
    nextText.textContent = events[index + 1].year + ' · ' + events[index + 1].title;
  } else {
    nextBtn.disabled = true;
    nextText.textContent = '已是终点';
  }

  viewTimeline.classList.remove('active');
  viewTimeline.classList.add('hidden');
  viewDetail.classList.remove('hidden');
  viewDetail.classList.add('active');
  window.scrollTo(0, 0);
}

function backToTimeline() {
  viewDetail.classList.remove('active');
  viewDetail.classList.add('hidden');
  viewTimeline.classList.remove('hidden');
  viewTimeline.classList.add('active');
  window.scrollTo(0, 0);
}

document.getElementById('backBtn').addEventListener('click', backToTimeline);
document.getElementById('prevBtn').addEventListener('click', () => {
  if (currentIndex > 0) showDetail(currentIndex - 1);
});
document.getElementById('nextBtn').addEventListener('click', () => {
  if (currentIndex < events.length - 1) showDetail(currentIndex + 1);
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && viewDetail.classList.contains('active')) {
    backToTimeline();
  }
});
</script>
